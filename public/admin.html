<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LogiFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-truck"></i>
                <span>LogiFlow Admin</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Back to Site</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="admin-container">
        <h1>Admin Dashboard</h1>
        
        <div class="admin-stats">
            <div class="stat-card">
                <i class="fas fa-box"></i>
                <div>
                    <h3 id="totalShipments">0</h3>
                    <p>Total Shipments</p>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <div>
                    <h3 id="pendingShipments">0</h3>
                    <p>Pending</p>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-truck"></i>
                <div>
                    <h3 id="inTransitShipments">0</h3>
                    <p>In Transit</p>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-check"></i>
                <div>
                    <h3 id="deliveredShipments">0</h3>
                    <p>Delivered</p>
                </div>
            </div>
        </div>

        <div class="admin-section">
            <h2>Shipment Management</h2>
            <div class="shipments-table">
                <table id="shipmentsTable">
                    <thead>
                        <tr>
                            <th>Tracking ID</th>
                            <th>Sender</th>
                            <th>Recipient</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="admin-section" style="margin-top:2rem;">
            <h2><i class="fas fa-comments"></i> Live Chat Inbox <span id="unreadBadge" style="display:none;background:#f44336;color:white;border-radius:50%;padding:2px 8px;font-size:0.8rem;margin-left:8px;">0</span></h2>
            <div style="display:grid;grid-template-columns:250px 1fr;gap:1rem;margin-top:1rem;">
                <!-- Sessions list -->
                <div style="background:#f8f9fa;border-radius:8px;padding:1rem;">
                    <h4 style="margin:0 0 1rem 0;color:#1a237e;">Active Users</h4>
                    <div id="sessionsList"><p style="color:#999;font-size:0.9rem;">No active chats</p></div>
                </div>
                <!-- Chat window -->
                <div style="background:#f8f9fa;border-radius:8px;padding:1rem;display:flex;flex-direction:column;">
                    <div id="adminChatHeader" style="margin-bottom:0.75rem;color:#1a237e;font-weight:bold;">Select a user to chat</div>
                    <div id="adminChatMessages" style="flex:1;min-height:300px;max-height:400px;overflow-y:auto;background:white;border-radius:8px;padding:1rem;margin-bottom:0.75rem;"></div>
                    <div style="display:flex;gap:0.5rem;">
                        <input type="text" id="adminChatInput" placeholder="Type a reply..." style="flex:1;padding:10px;border:2px solid #ddd;border-radius:5px;font-size:1rem;" onkeypress="handleAdminChatKey(event)" disabled>
                        <button onclick="sendAdminReply()" class="btn btn-primary" id="adminSendBtn" disabled><i class="fas fa-paper-plane"></i> Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
